@if (sentTo(); as email) {
    <div class="heading">
        <span class="status ok"><app-icon name="check" [size]="26" /></span>
        <h1>Message envoyé</h1>
        <p>
            Nous vous répondons à <strong>{{ email }}</strong
            >, en moins de 3 h en général. Pensez aux courriers indésirables.
        </p>
    </div>

    <a routerLink="/login" class="btn btn-primary btn-block">Retour à la connexion</a>
} @else {
    <a routerLink="/login" class="back">
        <app-icon name="chevron-left" [size]="16" />
        Connexion
    </a>

    <div class="heading">
        <span class="status"><app-icon name="help" [size]="26" /></span>
        <h1>Contacter le support</h1>
        <p>Nous répondons par e-mail, en moins de 3 h en général.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (error()) {
            <div class="alert alert-error" role="alert">{{ error() }}</div>
        }

        <label class="field">
            <span>Votre demande</span>
            <select class="input" formControlName="reason">
                @for (reason of reasons; track reason.value) {
                    <option [value]="reason.value">{{ reason.label }}</option>
                }
            </select>
        </label>

        <label class="field">
            <span>Votre nom</span>
            <input
                class="input"
                type="text"
                formControlName="name"
                autocomplete="name"
                maxlength="80"
                [class.invalid]="hasError('name', 'required')"
            />
            @if (hasError("name", "required")) {
                <small class="field-error" role="alert">Votre nom est obligatoire.</small>
            }
        </label>

        <label class="field">
            <span>E-mail où vous répondre</span>
            <input
                class="input"
                type="email"
                formControlName="email"
                autocomplete="email"
                maxlength="100"
                [class.invalid]="hasError('email', 'required') || hasError('email', 'email')"
            />
            @if (hasError("email", "required")) {
                <small class="field-error" role="alert">L'adresse e-mail est obligatoire.</small>
            } @else if (hasError("email", "email")) {
                <small class="field-error" role="alert">L'adresse e-mail n'est pas valide.</small>
            }
        </label>

        <label class="field">
            <span>Nom de votre boutique <em>(facultatif)</em></span>
            <input class="input" type="text" formControlName="shopName" maxlength="80" />
        </label>

        <label class="field">
            <span>Message</span>
            <textarea
                class="input"
                rows="5"
                formControlName="message"
                maxlength="2000"
                [class.invalid]="
                    hasError('message', 'required') || hasError('message', 'minlength')
                "
            ></textarea>
            @if (hasError("message", "required") || hasError("message", "minlength")) {
                <small class="field-error" role="alert">
                    Décrivez votre problème en quelques mots.
                </small>
            }
        </label>

        <!-- Piège à robots : invisible pour une vraie personne -->
        <input
            class="trap"
            type="text"
            formControlName="website"
            tabindex="-1"
            autocomplete="off"
            aria-hidden="true"
        />

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
            @if (loading()) {
                <span class="spinner"></span> Envoi…
            } @else {
                Envoyer
            }
        </button>
    </form>
}
