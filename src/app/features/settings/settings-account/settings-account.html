<app-page-header
    title="Mon compte"
    subtitle="Votre nom, votre email et votre mot de passe"
    section="Paramètres"
    back="/settings"
    backLabel="Retour aux paramètres"
/>

<form class="card section" [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate>
    <div class="section-head">
        <span class="section-icon"><app-icon name="user" [size]="20" /></span>
        <div>
            <h2>Profil</h2>
            <p class="muted">{{ auth.roleLabel() }}</p>
        </div>
    </div>

    <label class="field">
        <span>Nom</span>
        <input
            class="input"
            type="text"
            formControlName="name"
            maxlength="100"
            autocomplete="name"
            [class.invalid]="invalidProfile('name')"
            [attr.aria-invalid]="invalidProfile('name')"
        />
        @if (invalidProfile("name")) {
            <small class="field-error" role="alert">Le nom est obligatoire.</small>
        }
    </label>

    <label class="field">
        <span>Adresse email</span>
        <input
            class="input"
            type="email"
            formControlName="email"
            maxlength="150"
            autocomplete="email"
            [class.invalid]="invalidProfile('email')"
            [attr.aria-invalid]="invalidProfile('email')"
        />
        @if (invalidProfile("email")) {
            <small class="field-error" role="alert">Indiquez une adresse email valide.</small>
        } @else {
            <small class="muted">Elle sert à vous connecter.</small>
        }
    </label>

    @if (profileMessage(); as message) {
        <div
            class="alert"
            [class.alert-success]="message.ok"
            [class.alert-error]="!message.ok"
            [attr.role]="message.ok ? 'status' : 'alert'"
        >
            {{ message.text }}
        </div>
    }

    <div class="actions">
        <button
            type="button"
            class="btn btn-outline"
            [disabled]="savingProfile() || profileForm.pristine"
            (click)="cancelProfile()"
        >
            Annuler
        </button>
        <button
            type="submit"
            class="btn btn-primary"
            [disabled]="savingProfile() || profileForm.pristine"
        >
            @if (savingProfile()) {
                <span class="spinner"></span>
            }
            Enregistrer
        </button>
    </div>
</form>

<form id="password" class="card section" [formGroup]="passwordForm" (ngSubmit)="savePassword()" novalidate>
    <div class="section-head">
        <span class="section-icon"><app-icon name="key" [size]="20" /></span>
        <div>
            <h2>Mot de passe</h2>
            <p class="muted">Choisissez au moins 8 caractères. Gardez-le pour vous seul.</p>
        </div>
    </div>

    <label class="field">
        <span>Mot de passe actuel</span>
        <input
            class="input"
            type="password"
            formControlName="currentPassword"
            autocomplete="current-password"
            [class.invalid]="invalidPassword('currentPassword')"
            [attr.aria-invalid]="invalidPassword('currentPassword')"
        />
        @if (invalidPassword("currentPassword")) {
            <small class="field-error" role="alert">Indiquez votre mot de passe actuel.</small>
        }
    </label>

    <label class="field">
        <span>Nouveau mot de passe</span>
        <input
            class="input"
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
            [class.invalid]="invalidPassword('newPassword')"
            [attr.aria-invalid]="invalidPassword('newPassword')"
        />
        @if (invalidPassword("newPassword")) {
            <small class="field-error" role="alert">
                Le mot de passe doit contenir au moins 8 caractères.
            </small>
        }
    </label>

    <label class="field">
        <span>Confirmer le nouveau mot de passe</span>
        <input
            class="input"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            [class.invalid]="
                invalidPassword('confirmPassword') ||
                (passwordForm.controls.confirmPassword.touched && passwordForm.hasError('mismatch'))
            "
        />
        @if (passwordForm.controls.confirmPassword.touched && passwordForm.hasError("mismatch")) {
            <small class="field-error" role="alert">Les deux mots de passe sont différents.</small>
        }
    </label>

    @if (passwordMessage(); as message) {
        <div
            class="alert"
            [class.alert-success]="message.ok"
            [class.alert-error]="!message.ok"
            [attr.role]="message.ok ? 'status' : 'alert'"
        >
            {{ message.text }}
        </div>
    }

    <div class="actions">
        <button
            type="submit"
            class="btn btn-primary"
            [disabled]="savingPassword() || passwordForm.pristine"
        >
            @if (savingPassword()) {
                <span class="spinner"></span>
            }
            Modifier le mot de passe
        </button>
    </div>
</form>

<app-unsaved-dialog />
