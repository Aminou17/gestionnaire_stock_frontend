<app-page-header
    title="Mon profil"
    subtitle="Votre nom et votre adresse email"
    section="Paramètres"
    back="/settings"
    backLabel="Retour aux paramètres"
/>

<form class="card section" [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate>
    <div class="section-head">
        <span class="section-icon"><app-icon name="user" [size]="20" /></span>
        <div>
            <h2>Profil</h2>
            <p class="muted">{{ auth.roleLabel() }}</p>
        </div>
    </div>

    <div class="photo">
        <button
            type="button"
            class="photo-btn"
            (click)="fileInput.click()"
            [disabled]="savingPhoto()"
            aria-label="Changer la photo de profil"
        >
            <app-avatar [photo]="auth.user()?.avatar" />
            <span class="photo-badge"><app-icon name="camera" [size]="14" /></span>
        </button>
        <div class="photo-text">
            <strong>Photo de profil</strong>
            <span class="muted">PNG ou JPEG, carrée de préférence</span>
            @if (auth.user()?.avatar) {
                <button
                    type="button"
                    class="photo-remove"
                    (click)="removePhoto()"
                    [disabled]="savingPhoto()"
                >
                    Retirer la photo
                </button>
            }
        </div>
        <input
            #fileInput
            type="file"
            accept="image/png,image/jpeg"
            hidden
            (change)="onPhoto($event)"
        />
    </div>
    @if (photoError()) {
        <small class="field-error" role="alert">{{ photoError() }}</small>
    }

    <label class="field">
        <span>Nom</span>
        <input
            class="input"
            type="text"
            formControlName="name"
            maxlength="100"
            autocomplete="name"
            [class.invalid]="invalidProfile('name')"
            [attr.aria-invalid]="invalidProfile('name')"
        />
        @if (invalidProfile("name")) {
            <small class="field-error" role="alert">Le nom est obligatoire.</small>
        }
    </label>

    <label class="field">
        <span>Adresse email</span>
        <input
            class="input"
            type="email"
            formControlName="email"
            maxlength="150"
            autocomplete="email"
            [class.invalid]="invalidProfile('email')"
            [attr.aria-invalid]="invalidProfile('email')"
        />
        @if (invalidProfile("email")) {
            <small class="field-error" role="alert">Indiquez une adresse email valide.</small>
        } @else {
            <small class="muted">Elle sert à vous connecter.</small>
        }
    </label>

    @if (profileMessage(); as message) {
        <div
            class="alert"
            [class.alert-success]="message.ok"
            [class.alert-error]="!message.ok"
            [attr.role]="message.ok ? 'status' : 'alert'"
        >
            {{ message.text }}
        </div>
    }

    <div class="actions">
        <button
            type="button"
            class="btn btn-outline"
            [disabled]="savingProfile() || profileForm.pristine"
            (click)="cancelProfile()"
        >
            Annuler
        </button>
        <button
            type="submit"
            class="btn btn-primary"
            [disabled]="savingProfile() || profileForm.pristine"
        >
            @if (savingProfile()) {
                <span class="spinner"></span>
            }
            Enregistrer
        </button>
    </div>
</form>

<app-unsaved-dialog />
