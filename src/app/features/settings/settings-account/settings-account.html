<app-page-header
    title="Mon profil"
    section="Paramètres"
    back="/settings"
    backLabel="Retour aux paramètres"
/>

<form class="card section" [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate>
    <div class="hero">
        <button
            type="button"
            class="photo-btn"
            (click)="fileInput.click()"
            [disabled]="savingPhoto()"
            aria-label="Changer la photo de profil"
        >
            <app-avatar [photo]="auth.user()?.avatar" />
            <span class="photo-badge"><app-icon name="camera" [size]="16" /></span>
        </button>
        <strong class="hero-name">{{ auth.user()?.name }}</strong>
        <span class="role-badge">{{ auth.roleLabel() }}</span>
        @if (auth.user()?.avatar) {
            <button
                type="button"
                class="photo-remove"
                (click)="removePhoto()"
                [disabled]="savingPhoto()"
            >
                Retirer la photo
            </button>
        }
        <input
            #fileInput
            type="file"
            accept="image/png,image/jpeg"
            hidden
            (change)="onPhoto($event)"
        />
    </div>
    @if (photoError()) {
        <small class="field-error" role="alert">{{ photoError() }}</small>
    }

    <label class="field">
        <span>Nom</span>
        <input
            class="input"
            type="text"
            formControlName="name"
            maxlength="100"
            autocomplete="name"
            [class.invalid]="invalidProfile('name')"
            [attr.aria-invalid]="invalidProfile('name')"
        />
        @if (invalidProfile("name")) {
            <small class="field-error" role="alert">Le nom est obligatoire.</small>
        }
    </label>

    <label class="field">
        <span>Adresse email</span>
        <input
            class="input"
            type="email"
            formControlName="email"
            maxlength="150"
            autocomplete="email"
            [class.invalid]="invalidProfile('email')"
            [attr.aria-invalid]="invalidProfile('email')"
        />
        @if (invalidProfile("email")) {
            <small class="field-error" role="alert">Indiquez une adresse email valide.</small>
        }
    </label>

    @if (profileMessage(); as message) {
        <div
            class="alert"
            [class.alert-success]="message.ok"
            [class.alert-error]="!message.ok"
            [attr.role]="message.ok ? 'status' : 'alert'"
        >
            {{ message.text }}
        </div>
    }

    <div class="actions">
        <button
            type="button"
            class="btn btn-outline"
            [disabled]="savingProfile() || profileForm.pristine"
            (click)="cancelProfile()"
        >
            Annuler
        </button>
        <button
            type="submit"
            class="btn btn-primary"
            [disabled]="savingProfile() || profileForm.pristine"
        >
            @if (savingProfile()) {
                <span class="spinner"></span>
            }
            Enregistrer
        </button>
    </div>
</form>

<section class="card section options" aria-label="Sécurité et préférences">
    <a class="option" routerLink="/settings/password">
        <span class="option-icon"><app-icon name="key" [size]="18" /></span>
        <span class="option-text">Changer mon mot de passe</span>
        <app-icon class="option-arrow" name="chevron-right" [size]="16" />
    </a>

    <button type="button" class="option" [disabled]="sendingReset()" (click)="sendReset()">
        <span class="option-icon"><app-icon name="mail" [size]="18" /></span>
        <span class="option-text">
            Mot de passe oublié
            <small class="muted">Recevoir un lien par e-mail</small>
        </span>
        @if (sendingReset()) {
            <span class="spinner"></span>
        }
    </button>

    @if (resetMessage(); as message) {
        <div
            class="alert"
            [class.alert-success]="message.ok"
            [class.alert-error]="!message.ok"
            [attr.role]="message.ok ? 'status' : 'alert'"
        >
            {{ message.text }}
        </div>
    }

    <button type="button" class="option" (click)="theme.toggle()">
        <span class="option-icon">
            <app-icon [name]="theme.theme() === 'dark' ? 'moon' : 'sun'" [size]="18" />
        </span>
        <span class="option-text">Mode sombre</span>
        <span class="switch" [class.on]="theme.theme() === 'dark'"></span>
    </button>

    <button type="button" class="option logout" (click)="auth.logoutAsked.set(true)">
        <span class="option-icon"><app-icon name="logout" [size]="18" /></span>
        <span class="option-text">Se déconnecter</span>
    </button>
</section>

<app-unsaved-dialog />
