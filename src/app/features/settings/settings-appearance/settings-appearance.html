<app-page-header
    title="Apparence"
    subtitle="Thème de l'application"
    section="Paramètres"
    back="/settings"
    backLabel="Retour aux paramètres"
/>

<section class="card section">
    <div class="section-head">
        <span class="section-icon"><app-icon name="palette" [size]="20" /></span>
        <div>
            <h2>Thème</h2>
            <p class="muted">
                Le choix s'applique tout de suite et reste mémorisé sur cet appareil.
            </p>
        </div>
    </div>

    <div class="themes" role="radiogroup" aria-label="Thème">
        @for (option of themes; track option.value) {
            <label class="theme-option" [class.selected]="theme.theme() === option.value">
                <input
                    type="radio"
                    name="theme"
                    [value]="option.value"
                    [checked]="theme.theme() === option.value"
                    (change)="theme.theme.set(option.value)"
                />

                <span class="sample" [class.dark]="option.value === 'dark'" aria-hidden="true">
                    <span class="sample-menu"></span>
                    <span class="sample-page">
                        <span class="sample-line"></span>
                        <span class="sample-line short"></span>
                        <span class="sample-card"></span>
                    </span>
                </span>

                <span class="theme-label">
                    <app-icon [name]="option.value === 'dark' ? 'moon' : 'sun'" [size]="16" />
                    {{ option.label }}
                </span>
            </label>
        }
    </div>
</section>
