<app-page-header title="Paramètres" subtitle="Réglages de la boutique et de votre compte" />

<div class="content">
    <section class="card profile">
        <a
            routerLink="/settings/account"
            class="avatar-link"
            aria-label="Changer ma photo de profil"
        >
            <app-avatar class="avatar" [photo]="auth.user()?.avatar" />
        </a>

        <div class="profile-info">
            <strong>{{ auth.user()?.name }}</strong>
            <span class="muted">{{ auth.user()?.email }}</span>
        </div>

        <span class="badge badge-primary">{{ auth.roleLabel() }}</span>
    </section>

    @for (group of groups(); track group.title) {
        <section class="group">
            <h2>{{ group.title }}</h2>

            <nav class="card list" [attr.aria-label]="group.title">
                @for (link of group.links; track link.path) {
                    <a [routerLink]="link.path" class="item">
                        <span class="item-icon"><app-icon [name]="link.icon" [size]="20" /></span>

                        <span class="item-text">
                            <strong>{{ link.label }}</strong>
                            <small class="muted">{{ link.description }}</small>
                        </span>

                        <app-icon name="chevron-right" [size]="18" class="chevron" />
                    </a>
                }
            </nav>
        </section>
    }

    <section class="group">
        <h2>Affichage</h2>

        <div class="card list">
            <button
                type="button"
                class="item theme-toggle"
                role="switch"
                [attr.aria-checked]="theme.theme() === 'dark'"
                (click)="theme.toggle()"
            >
                <span class="item-icon">
                    <app-icon [name]="theme.theme() === 'dark' ? 'moon' : 'sun'" [size]="20" />
                </span>
                <span class="item-text">
                    <strong>Mode sombre</strong>
                    <small class="muted">Mémorisé sur cet appareil</small>
                </span>
                <span
                    class="switch"
                    [class.on]="theme.theme() === 'dark'"
                    aria-hidden="true"
                ></span>
            </button>
        </div>
    </section>
</div>
