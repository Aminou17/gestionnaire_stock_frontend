<dialog #box aria-labelledby="line-title" (click)="onBackdrop($event)">
    @if (line(); as line) {
        <form (submit)="$event.preventDefault(); save()">
            <h2 id="line-title">{{ line.productName }}</h2>

            <label class="field">
                <span>Quantité comptée</span>
                <input
                    class="input count"
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    autocomplete="off"
                    placeholder="?"
                    [value]="value()"
                    (input)="onInput($event)"
                />
            </label>

            @if (hasGap()) {
                <div class="reason">
                    <span class="reason-title">Raison de l'écart</span>
                    <div class="chips" role="group" aria-label="Raison de l'écart">
                        @for (item of reasons; track item.value) {
                            <button
                                type="button"
                                class="chip"
                                [attr.aria-pressed]="reason() === item.value"
                                (click)="pickReason(item.value)"
                            >
                                {{ item.label }}
                            </button>
                        }
                    </div>
                </div>
            }

            @if (error()) {
                <p class="alert alert-error" role="alert">{{ error() }}</p>
            }

            <div class="actions">
                <button
                    type="button"
                    class="btn btn-outline"
                    [disabled]="saving()"
                    (click)="close()"
                >
                    Annuler
                </button>
                <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="saving() || value() === ''"
                >
                    Enregistrer
                </button>
            </div>

            <button type="button" class="remove" [disabled]="saving()" (click)="remove()">
                Retirer du comptage
            </button>
        </form>
    }
</dialog>
