<app-page-header
    title="Nouveau comptage"
    section="Plus d'outils"
    [back]="'/inventories'"
    backLabel="Retour aux inventaires"
/>

<section class="card box" aria-live="polite">
    @if (error()) {
        <p class="alert alert-error" role="alert">{{ error() }}</p>
        <button type="button" class="btn btn-primary" (click)="start()">Réessayer</button>
    } @else {
        <span class="spinner" aria-hidden="true"></span>
        <p class="muted">Ouverture du comptage…</p>
    }
</section>
