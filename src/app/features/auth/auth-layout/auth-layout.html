<div class="page">
    <header class="bar">
        <a class="brand" routerLink="/" aria-label="{{ productName }}, retour à l'accueil">
            <img class="brand-logo" src="/icons/icon-192.png" alt="" width="40" height="40" />
            <span class="brand-text">
                <span class="brand-name">{{ productName }}</span>
                <span class="brand-sub">par {{ companyName }}</span>
            </span>
        </a>
        <a class="home" routerLink="/">
            <app-icon name="chevron-left" [size]="16" />
            Accueil
        </a>
    </header>

    <main class="content">
        <div class="card">
            <router-outlet />
        </div>
    </main>

    <footer>
        <span>© {{ year }} {{ productName }} · {{ companyName }}</span>
        <nav class="legal-links" aria-label="Informations légales">
            <a routerLink="/privacy">Confidentialité</a>
            <a routerLink="/terms">Conditions</a>
            <a routerLink="/contact">Contact</a>
        </nav>
    </footer>
</div>
