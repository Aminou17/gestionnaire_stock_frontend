<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="heading">
        <h1>Connexion</h1>
        <p>Accédez à votre espace de gestion.</p>
    </div>

    @if (error()) {
        <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <label class="field">
        <span>Adresse email</span>
        <input
            class="input"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="vous@exemple.com"
            [class.invalid]="hasError('email', 'required') || hasError('email', 'email')"
        />
        @if (hasError("email", "required")) {
            <small class="field-error">L'adresse email est obligatoire.</small>
        } @else if (hasError("email", "email")) {
            <small class="field-error">L'adresse email n'est pas valide.</small>
        }
    </label>

    <div class="field">
        <label for="password">Mot de passe</label>
        <div class="password">
            <input
                id="password"
                class="input"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="••••••••"
                [class.invalid]="hasError('password', 'required')"
            />
            <button
                type="button"
                class="toggle"
                [attr.aria-pressed]="showPassword()"
                (click)="showPassword.set(!showPassword())"
            >
                {{ showPassword() ? "Masquer" : "Afficher" }}
            </button>
        </div>
        @if (hasError("password", "required")) {
            <small class="field-error">Le mot de passe est obligatoire.</small>
        }
    </div>

    <label class="remember">
        <input type="checkbox" formControlName="remember" />
        Se souvenir de moi
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        @if (loading()) {
            <span class="spinner"></span> Connexion…
        } @else {
            Se connecter
        }
    </button>

    <a routerLink="/forgot-password" class="forgot">Mot de passe oublié ?</a>
</form>
