<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="heading">
        <h1>Connexion</h1>
        <p>Accédez à votre espace de gestion.</p>
    </div>

    @if (error()) {
        <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <label class="field">
        <span>Adresse email</span>
        <span class="control">
            <app-icon name="mail" [size]="18" />
            <input
                class="input"
                type="email"
                formControlName="email"
                autocomplete="email"
                placeholder="vous@exemple.com"
                [class.invalid]="hasError('email', 'required') || hasError('email', 'email')"
            />
        </span>
        @if (hasError("email", "required")) {
            <small class="field-error">L'adresse email est obligatoire.</small>
        } @else if (hasError("email", "email")) {
            <small class="field-error">L'adresse email n'est pas valide.</small>
        }
    </label>

    <div class="field">
        <label for="password">Mot de passe</label>
        <div class="control password">
            <app-icon name="key" [size]="18" />
            <input
                id="password"
                class="input"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="Votre mot de passe"
                [class.invalid]="hasError('password', 'required')"
            />
            <button
                type="button"
                class="toggle"
                [attr.aria-pressed]="showPassword()"
                [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                (click)="showPassword.set(!showPassword())"
            >
                <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
            </button>
        </div>
        @if (hasError("password", "required")) {
            <small class="field-error">Le mot de passe est obligatoire.</small>
        }
    </div>

    <label class="remember">
        <input type="checkbox" formControlName="remember" />
        Se souvenir de moi
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        @if (loading()) {
            <span class="spinner"></span> Connexion…
        } @else {
            Se connecter
        }
    </button>

    <a routerLink="/forgot-password" class="forgot">Mot de passe oublié ?</a>

    <p class="switch">Pas encore de compte ? <a routerLink="/register">Créer ma boutique</a></p>
</form>
