<div class="card stat" [class.clickable]="!!link()">
    @if (link()) {
        <a class="cover" [routerLink]="link()" [attr.aria-label]="label()"></a>
    }

    <div class="top">
        <span class="label">{{ label() }}</span>
        <span class="icon tone-{{ iconTone() }}"><app-icon [name]="icon()" [size]="18" /></span>
    </div>

    @if (loading()) {
        <div class="skeleton value-skeleton"></div>
        <div class="skeleton hint-skeleton"></div>
    } @else if (error()) {
        <div class="value text-muted">—</div>
        <div class="hint text-muted">Données indisponibles</div>
    } @else {
        <div class="value" [class]="valueTone() ? 'text-' + valueTone() : ''">{{ value() }}</div>
        <div class="hint text-{{ hintTone() }}">{{ hint() }}</div>
    }

    <ng-content />
</div>
