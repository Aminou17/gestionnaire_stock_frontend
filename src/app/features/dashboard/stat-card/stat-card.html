<div class="card stat" [class.hero]="hero()" [class.clickable]="!!link()" [attr.data-tone]="tone()">
    @if (link()) {
        <a class="cover" [routerLink]="link()" [attr.aria-label]="label()"></a>
    }

    @if (!link() && toggles()) {
        <button
            type="button"
            class="cover"
            [attr.aria-label]="label()"
            (click)="toggled.emit()"
        ></button>
    }

    <span class="label">{{ label() }}</span>
    @if (toggles()) {
        <!-- l'œil de la valeur masquée prend la place de l'icône, au-dessus du bouton qui couvre la carte -->
        <span class="eye"><ng-content /></span>
    } @else {
        <span class="icon"><app-icon [name]="icon()" [size]="18" /></span>
    }

    @if (loading()) {
        <div class="skeleton value-skeleton"></div>
        <div class="skeleton hint-skeleton"></div>
    } @else if (error()) {
        <div class="value text-muted">—</div>
        <div class="hint text-muted">Données indisponibles</div>
    } @else {
        @if (money()) {
            <div
                class="value money-value"
                [class]="valueTone() ? 'text-' + valueTone() : ''"
                appMoney
            >
                {{ value() }}
            </div>
        } @else {
            <div class="value" [class]="valueTone() ? 'text-' + valueTone() : ''">
                {{ value() }}
            </div>
        }
        @if (hint()) {
            <div class="hint text-{{ hintTone() }}">{{ hint() }}</div>
        }
    }
</div>
