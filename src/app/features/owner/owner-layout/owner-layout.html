<header class="topbar">
    <div class="brand">
        <span class="brand-icon"><app-icon name="box" [size]="20" /></span>
        <div class="brand-text">
            <div class="brand-name">{{ productName }}</div>
            <div class="brand-sub">Espace propriétaire</div>
        </div>
    </div>

    <div class="tools">
        <span class="who">{{ auth.user()?.name }}</span>
        <a routerLink="/owner/password" class="icon-btn" aria-label="Mot de passe">
            <app-icon name="key" [size]="18" />
        </a>
        <button
            type="button"
            class="icon-btn"
            (click)="theme.toggle()"
            [attr.aria-label]="
                theme.theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'
            "
        >
            <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
        </button>
        <button type="button" class="btn btn-outline btn-sm" (click)="auth.logout()">
            <app-icon name="logout" [size]="16" />
            <span>Déconnexion</span>
        </button>
    </div>
</header>

<main class="content">
    <router-outlet />
</main>
