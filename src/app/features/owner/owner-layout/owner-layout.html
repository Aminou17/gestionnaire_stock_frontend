<aside class="side">
    <div class="brand">
        <img class="brand-logo" src="/icons/icon-192.png" alt="" width="38" height="38" />
        <div>
            <div class="brand-name">{{ productName }}</div>
            <div class="brand-sub">Espace propriétaire</div>
        </div>
    </div>

    <nav class="nav" aria-label="Espace propriétaire">
        @for (link of links; track link.path) {
            <a
                class="nav-link"
                [routerLink]="link.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: !!link.exact }"
                ariaCurrentWhenActive="page"
            >
                <span class="nav-icon">
                    <app-icon [name]="link.icon" [size]="20" />
                    @if (link.path === "/owner/support" && messagesBadge() > 0) {
                        <span
                            class="badge-count"
                            [attr.aria-label]="messagesBadge() + ' non lus'"
                            >{{ messagesBadge() }}</span
                        >
                    }
                </span>
                <span class="nav-label">{{ link.label }}</span>
            </a>
        }
    </nav>

    <div class="foot">
        <span class="who">{{ auth.user()?.name }}</span>
        <button
            type="button"
            class="foot-btn"
            (click)="theme.toggle()"
            [attr.aria-label]="
                theme.theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'
            "
        >
            <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
        </button>
        <button
            type="button"
            class="foot-btn logout"
            aria-label="Déconnexion"
            (click)="auth.logoutAsked.set(true)"
        >
            <app-icon name="logout" [size]="18" />
        </button>
    </div>
</aside>

<main class="content">
    <router-outlet />
</main>

<app-logout-dialog />
