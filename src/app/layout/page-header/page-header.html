<header [class.detail]="!!back()">
    <!-- une page avec flèche retour n'a pas besoin du menu : la flèche suffit -->
    @if (!auth.isOwner() && !back()) {
        <button
            type="button"
            class="menu-btn"
            (click)="layout.sidebarOpen.set(true)"
            aria-label="Ouvrir le menu"
        >
            <app-icon name="menu" [size]="20" />
        </button>
    }

    <div class="titles">
        @if (section()) {
            <p class="breadcrumb">{{ section() }} › {{ title() }}</p>
        }
        <div class="title-row">
            @if (back()) {
                <a [routerLink]="back()" class="back-btn" [attr.aria-label]="backLabel()">
                    <app-icon name="chevron-left" [size]="22" />
                </a>
            }
            <h1>{{ title() }}</h1>
        </div>
        @if (subtitle()) {
            <p>{{ subtitle() }}</p>
        }
    </div>

    <div class="actions">
        <ng-content />

        @if (auth.isAdmin()) {
            <app-notifications />
        }

        @if (!auth.isOwner()) {
            <a routerLink="/settings/account" class="me" aria-label="Mon profil">
                <app-avatar [photo]="auth.user()?.avatar" />
            </a>
        }
    </div>
</header>
