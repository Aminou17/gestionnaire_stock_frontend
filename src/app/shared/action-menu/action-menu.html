<button
    #trigger
    type="button"
    class="more-btn"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="label()"
    [disabled]="disabled()"
    (click)="toggle()"
>
    <app-icon [name]="icon()" />
</button>

<div
    #panel
    class="panel"
    popover="auto"
    role="menu"
    [attr.aria-label]="title() ?? label()"
    (toggle)="onToggle($event)"
>
    @if (title()) {
        <strong class="sheet-title">{{ title() }}</strong>
    }

    @for (item of items(); track item.id) {
        @if (item.href) {
            <a
                role="menuitem"
                class="item"
                [class.separated]="item.separated"
                [href]="item.href"
                target="_blank"
                rel="noopener"
                (click)="pick(item)"
            >
                <ng-container *ngTemplateOutlet="itemIcon; context: { $implicit: item }" />
                {{ item.label }}
            </a>
        } @else if (item.link) {
            <a
                role="menuitem"
                class="item"
                [class.danger]="item.danger"
                [class.separated]="item.separated"
                [routerLink]="item.link"
                (click)="pick(item)"
            >
                <ng-container *ngTemplateOutlet="itemIcon; context: { $implicit: item }" />
                {{ item.label }}
            </a>
        } @else {
            <button
                type="button"
                role="menuitem"
                class="item"
                [class.danger]="item.danger"
                [class.separated]="item.separated"
                [disabled]="item.disabled"
                (click)="pick(item)"
            >
                <ng-container *ngTemplateOutlet="itemIcon; context: { $implicit: item }" />
                {{ item.label }}
            </button>
        }
    }
</div>

<ng-template #itemIcon let-item>
    @if (item.icon === "whatsapp") {
        <app-whatsapp-icon [size]="18" />
    } @else {
        <app-icon [name]="item.icon" [size]="18" />
    }
</ng-template>
