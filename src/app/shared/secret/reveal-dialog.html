<dialog
    #dialog
    class="box"
    aria-labelledby="reveal-title"
    (click)="onBackdrop($event)"
    (close)="onClosed()"
>
    <form (submit)="$event.preventDefault(); submit()" novalidate>
        <h2 id="reveal-title">Afficher la valeur</h2>
        <p class="muted">Entrez votre mot de passe pour voir la valeur du stock.</p>

        <input
            class="input"
            type="password"
            autocomplete="current-password"
            placeholder="Mot de passe"
            aria-label="Mot de passe"
            autofocus
            [value]="password()"
            (input)="password.set($any($event.target).value)"
        />

        @if (error()) {
            <div class="alert alert-error" role="alert">{{ error() }}</div>
        }

        <div class="actions">
            <button type="button" class="btn btn-outline" (click)="dialog.close()">Annuler</button>
            <button type="submit" class="btn btn-primary" [disabled]="!password() || checking()">
                @if (checking()) {
                    <span class="spinner"></span>
                }
                Afficher
            </button>
        </div>
    </form>
</dialog>
