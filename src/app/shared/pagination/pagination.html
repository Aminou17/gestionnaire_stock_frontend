@if (visible()) {
    <nav class="pager" aria-label="Pagination">
        <div class="left">
            <p class="status" aria-live="polite">
                <span class="where">Page {{ page() }} sur {{ pages() }}</span>
                <span class="range">{{ first() }}–{{ last() }} sur {{ total() }}</span>
            </p>

            <label class="size">
                <span>Lignes par page</span>
                <select
                    class="chip"
                    [value]="pageSize()"
                    (change)="changeSize($any($event.target).value)"
                >
                    @for (size of sizes(); track size) {
                        <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
                    }
                </select>
            </label>
        </div>

        <div class="right">
            <button
                type="button"
                class="btn btn-outline step prev"
                [disabled]="page() <= 1"
                (click)="go(page() - 1)"
            >
                <app-icon name="chevron-left" [size]="16" />
                Précédent
            </button>

            <ol class="pages">
                @for (item of items(); track $index) {
                    @if (item === null) {
                        <li class="gap" aria-hidden="true">…</li>
                    } @else {
                        <li>
                            <button
                                type="button"
                                class="num"
                                [attr.aria-label]="'Page ' + item"
                                [attr.aria-current]="item === page() ? 'page' : null"
                                (click)="go(item)"
                            >
                                {{ item }}
                            </button>
                        </li>
                    }
                }
            </ol>

            <button
                type="button"
                class="btn btn-outline step next"
                [disabled]="page() >= pages()"
                (click)="go(page() + 1)"
            >
                Suivant
                <app-icon name="chevron-right" [size]="16" />
            </button>
        </div>
    </nav>
}
