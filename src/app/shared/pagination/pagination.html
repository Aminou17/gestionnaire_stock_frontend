@if (visible()) {
    <nav class="pager" aria-label="Pagination">
        <!-- lu par les lecteurs d'écran seulement : l'écran montre juste les numéros -->
        <p class="sr-only" aria-live="polite">
            Page {{ page() }} sur {{ pages() }}, {{ first() }} à {{ last() }} sur {{ total() }}
        </p>

        <div class="right">
            <button
                type="button"
                class="btn btn-outline step prev"
                aria-label="Page précédente"
                [disabled]="page() <= 1"
                (click)="go(page() - 1)"
            >
                <app-icon name="chevron-left" [size]="18" />
            </button>

            <ol class="pages">
                @for (item of items(); track $index) {
                    @if (item === null) {
                        <li class="gap" aria-hidden="true">…</li>
                    } @else {
                        <li>
                            <button
                                type="button"
                                class="num"
                                [attr.aria-label]="'Page ' + item"
                                [attr.aria-current]="item === page() ? 'page' : null"
                                (click)="go(item)"
                            >
                                {{ item }}
                            </button>
                        </li>
                    }
                }
            </ol>

            <button
                type="button"
                class="btn btn-outline step next"
                aria-label="Page suivante"
                [disabled]="page() >= pages()"
                (click)="go(page() + 1)"
            >
                <app-icon name="chevron-right" [size]="18" />
            </button>
        </div>
    </nav>
}
