<div class="field" role="group" [attr.aria-labelledby]="label() ? labelId : null">
    @if (label()) {
        <span [id]="labelId">
            {{ label() }}
            @if (optional()) {
                <small class="muted">(facultatif)</small>
            }
        </span>
    }

    <div class="phone-inputs">
        <div class="code">
            <span class="plus" aria-hidden="true">+</span>
            <input
                class="input"
                type="text"
                inputmode="numeric"
                maxlength="4"
                autocomplete="off"
                aria-label="Indicatif du pays"
                [value]="code()"
                [disabled]="disabled()"
                [class.invalid]="invalid()"
                (input)="onCodeInput($any($event.target))"
                (blur)="onBlur(number)"
            />
        </div>

        <input
            #number
            class="input"
            type="tel"
            inputmode="tel"
            maxlength="20"
            autocomplete="off"
            [placeholder]="placeholder()"
            [attr.aria-label]="label() ? 'Numéro de téléphone' : ariaLabel()"
            [attr.aria-invalid]="invalid()"
            [value]="national()"
            [disabled]="disabled()"
            [class.invalid]="invalid()"
            (input)="onNumberInput($any($event.target))"
            (blur)="onBlur(number)"
        />
    </div>

    @if (showCountry() && country()) {
        <small class="country muted">{{ country() }}</small>
    }
</div>
